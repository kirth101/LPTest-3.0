name: Build LPTest APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libffi-dev libssl-dev \
            libxml2-dev libxslt1-dev cmake

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 python-for-android==2024.1.21

      - name: Cache buildozer / Android SDK-NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      # Build APK, with automatic retries around the whole step.
      #
      # WHY: buildozer/python-for-android downloads several C-library
      # source tarballs (freetype, libffi, openssl, ...) from various
      # third-party mirrors mid-build -- e.g. freetype comes from
      # download.savannah.gnu.org, a GNU project server with a long,
      # well-documented history of intermittent 502 Bad Gateway outages
      # that have nothing to do with this repo's code. p4a already
      # retries an individual download 4 times over ~15 seconds, which
      # isn't long enough to ride out a real outage -- so when Savannah
      # (or any other upstream mirror p4a reaches out to) is down for
      # longer than that, the whole build fails outright.
      #
      # nick-fields/retry re-runs the ENTIRE step (not just one
      # download) up to 3 times, 60 seconds apart, giving a flaky
      # upstream server real time to recover instead of failing the
      # whole workflow over what's usually a transient, self-resolving
      # problem. buildozer/p4a's own caching (the actions/cache step
      # above, plus p4a's own packages/ dir under ~/.buildozer) means a
      # retry doesn't re-download things that already succeeded on the
      # previous attempt -- only the step that actually failed partway
      # through has to redo any real work.
      - name: Build APK
        uses: nick-fields/retry@v3
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/pip-constraints.txt
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            echo "pip==24.0" > pip-constraints.txt
            yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LPTest-debug-apk
          path: bin/*.apk
