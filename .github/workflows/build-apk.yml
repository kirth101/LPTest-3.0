name: Build LPTest APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libffi-dev libssl-dev \
            libxml2-dev libxslt1-dev cmake

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 python-for-android==2024.1.21

      # python-for-android bundles its OWN "reportlab" recipe, which
      # tries to compile reportlab's optional _rl_accel/_renderPM C
      # accelerators from source -- and that compile is fundamentally
      # broken under Python 3.11+ (CPython made PyFrameObject/struct
      # _frame opaque; _rl_accel.c still pokes at its old internal
      # layout directly). This is a known, confirmed, upstream p4a bug
      # (kivy/python-for-android#2782) -- not something version-pinning
      # or retrying fixes, since it's a genuine, deterministic compile
      # error every time. The community-verified fix (confirmed working
      # by the issue reporter): delete p4a's bundled reportlab recipe so
      # p4a has no choice but to fall back to a plain `pip install
      # reportlab` -- reportlab's own setup.py treats these C
      # accelerators as optional and gracefully skips a failed one
      # instead of aborting, which p4a's dedicated recipe does not do.
      - name: Remove python-for-android's broken bundled reportlab recipe
        run: |
          python -c "
          import os, shutil, pythonforandroid
          recipe_dir = os.path.join(os.path.dirname(pythonforandroid.__file__), 'recipes', 'reportlab')
          if os.path.isdir(recipe_dir):
              shutil.rmtree(recipe_dir)
              print(f'Removed broken bundled reportlab recipe: {recipe_dir}')
          else:
              print('No bundled reportlab recipe found -- nothing to do.')
          "

      - name: Cache buildozer / Android SDK-NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}

      # A restored cache from an earlier, since-fixed-in-code failed run
      # can still contain a half-built/broken other_builds/ directory for
      # a specific recipe (reportlab's old broken C-accelerator build,
      # or a pyjnius/pillow resolve that picked an unavailable version at
      # the time) -- that stale, partially-built state persists across
      # runs via actions/cache and can make the SAME recipe fail again
      # even after the underlying cause is fixed, since p4a tries to
      # resume from it instead of starting clean. Force those specific
      # recipes to rebuild from scratch on every run, unconditionally --
      # NDK/SDK/freetype/python3/kivy etc. from the cache are untouched
      # and stay fast.
      - name: Clear any stale pyjnius/reportlab/pillow build state from cache
        run: |
          find .buildozer -iregex ".*/other_builds/\(pyjnius\|reportlab\|pillow\).*" -exec rm -rf {} + 2>/dev/null
          echo "done"

      # Build APK, with automatic retries around the whole step.
      #
      # WHY RETRY AT ALL: buildozer/python-for-android downloads several
      # C-library source tarballs (freetype, libffi, openssl, ...) from
      # various third-party mirrors mid-build, and also resolves pip
      # packages (like pyjnius, pillow) from PyPI -- both are outside
      # this repo's control and occasionally return transient errors
      # (502s, "from versions: none" on an otherwise-real release,
      # timeouts) that have nothing to do with this repo's code and
      # usually resolve themselves within a few minutes.
      #
      # WHY on_retry_command: a failed attempt can leave p4a's OWN build
      # state (under .buildozer/.../other_builds/<recipe>/) partially
      # written -- re-running the same build command against that
      # half-finished state doesn't just retry the thing that failed, it
      # can fail in a DIFFERENT, unrelated way on the next attempt
      # (seen in practice: one failed attempt on a real pyjnius/reportlab
      # problem, then later attempts failing immediately with an
      # unrelated "'NoneType' object has no attribute 'pip'" crash,
      # because they inherited the half-built state instead of starting
      # clean). on_retry_command runs BEFORE each retry and wipes out
      # just the pyjnius/reportlab/pillow build directories -- not the
      # whole .buildozer cache -- so each retry gets a genuinely clean
      # shot at the parts that broke, while NDK/SDK/freetype/etc. from a
      # successful earlier stage stay cached and don't get re-downloaded.
      - name: Build APK
        uses: nick-fields/retry@v3
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/pip-constraints.txt
        with:
          timeout_minutes: 45
          max_attempts: 5
          retry_wait_seconds: 90
          on_retry_command: |
            find .buildozer -iregex ".*/other_builds/\(pyjnius\|reportlab\|pillow\).*" -exec rm -rf {} + 2>/dev/null
            echo "Cleaned partial pyjnius/reportlab/pillow build state before retrying."
          command: |
            echo "pip==24.0" > pip-constraints.txt
            yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LPTest-debug-apk
          path: bin/*.apk
