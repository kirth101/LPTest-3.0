name: Build LPTest APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libffi-dev libssl-dev \
            libxml2-dev libxslt1-dev cmake

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 python-for-android==2024.1.21

      # python-for-android bundles its OWN "reportlab" recipe, which
      # ROOT CAUSE, finally confirmed: buildozer keeps its OWN isolated
      # clone of python-for-android under
      # .buildozer/android/platform/python-for-android/ -- separate from
      # the pip-installed copy in this job's Python environment. Deleting
      # the recipe from the pip-installed copy (below) and clearing
      # p4a-recipes (further below) never reached THAT copy, which is why
      # the broken reportlab recipe (hg.reportlab.com, 404) kept
      # resurfacing no matter how thoroughly those two locations were
      # cleaned. The actual, authoritative fix is
      # p4a.blacklist_requirements = reportlab in buildozer.spec, p4a's
      # own official "never use a recipe for this requirement, anywhere,
      # always just pip install it" flag (--blacklist-requirements on the
      # CLI) -- this can't be dodged by however many copies of p4a exist
      # on disk. The two steps below are kept as harmless defense-in-depth
      # (removing a directory that doesn't exist is a no-op) but are no
      # longer what's actually fixing this.
      - name: Remove python-for-android's broken bundled reportlab recipe
        run: |
          python -c "
          import os, shutil, pythonforandroid
          recipe_dir = os.path.join(os.path.dirname(pythonforandroid.__file__), 'recipes', 'reportlab')
          if os.path.isdir(recipe_dir):
              shutil.rmtree(recipe_dir)
              print(f'Removed broken bundled reportlab recipe: {recipe_dir}')
          else:
              print('No bundled reportlab recipe found -- nothing to do.')
          "
          rm -rf p4a-recipes
          mkdir -p p4a-recipes
          echo "p4a-recipes cleared (kept as an empty directory)."

      - name: Cache buildozer / Android SDK-NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-v4-${{ hashFiles('buildozer.spec') }}

      # A restored cache from an earlier, since-fixed-in-code failed run
      # can still contain a half-built/broken other_builds/ directory for
      # a specific recipe (reportlab's old broken C-accelerator build,
      # or a pyjnius/pillow resolve that picked an unavailable version at
      # the time), AND/OR a cached dists/<name>/ directory that recorded
      # which recipe/source was used to build it during that earlier
      # attempt -- p4a can reuse that recorded info instead of
      # re-discovering recipes fresh from disk, which is how a recipe
      # that's provably no longer present on disk (verified in the
      # previous step) can still get used with its old, broken URL.
      # That stale, partially-built state persists across runs via
      # actions/cache and can make the SAME recipe fail again even after
      # the underlying cause is fixed. Force those specific recipes AND
      # any cached dist to rebuild from scratch on every run,
      # unconditionally -- NDK/SDK/freetype/python3/kivy packages/ dir
      # from the cache are untouched and stay fast.
      - name: Clear any stale pyjnius/reportlab/pillow build state and cached dists
        run: |
          mkdir -p .buildozer
          find .buildozer -iregex ".*/other_builds/\(pyjnius\|reportlab\|pillow\).*" -exec rm -rf {} + 2>/dev/null || true
          find .buildozer -type d -path "*/dists/*" -maxdepth 6 -exec rm -rf {} + 2>/dev/null || true
          echo "done"

      # Build APK, with automatic retries around the whole step.
      #
      # WHY RETRY AT ALL: buildozer/python-for-android downloads several
      # C-library source tarballs (freetype, libffi, openssl, ...) from
      # various third-party mirrors mid-build, and also resolves pip
      # packages (like pyjnius, pillow) from PyPI -- both are outside
      # this repo's control and occasionally return transient errors
      # (502s, "from versions: none" on an otherwise-real release,
      # timeouts) that have nothing to do with this repo's code and
      # usually resolve themselves within a few minutes.
      #
      # WHY on_retry_command: a failed attempt can leave p4a's OWN build
      # state (under .buildozer/.../other_builds/<recipe>/ and
      # .buildozer/.../dists/<name>/) partially written -- re-running the
      # same build command against that half-finished state doesn't just
      # retry the thing that failed, it can fail in a DIFFERENT,
      # unrelated way on the next attempt, or keep reusing stale
      # recipe/source info recorded in a cached dist even after the
      # actual recipe files on disk have been fixed. on_retry_command
      # runs BEFORE each retry and wipes out just the
      # pyjnius/reportlab/pillow build directories and any cached dist --
      # not the whole .buildozer cache -- so each retry gets a genuinely
      # clean shot at the parts that broke, while NDK/SDK/freetype/etc.
      # from a successful earlier stage stay cached and don't get
      # re-downloaded.
      - name: Build APK
        uses: nick-fields/retry@v3
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/pip-constraints.txt
        with:
          timeout_minutes: 45
          max_attempts: 5
          retry_wait_seconds: 90
          on_retry_command: |
            mkdir -p .buildozer
            find .buildozer -iregex ".*/other_builds/\(pyjnius\|reportlab\|pillow\).*" -exec rm -rf {} + 2>/dev/null || true
            find .buildozer -type d -path "*/dists/*" -maxdepth 6 -exec rm -rf {} + 2>/dev/null || true
            echo "Cleaned partial pyjnius/reportlab/pillow build state and cached dists before retrying."
          command: |
            echo "pip==24.0" > pip-constraints.txt
            yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LPTest-debug-apk
          path: bin/*.apk
